<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">Following a material relationship</title><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#4B6070"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#029990"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#0163D5"/></marker></defs><rect width="1280" height="720" fill="#FFFFFF"/><text x="64" y="64" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#029990">TECHNICAL ART · WEEK 2</text><text x="64" y="128" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#0A4054">Following a material relationship</text><text x="64" y="172" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#4B6070">Textures supply data. A graph describes how material inputs are computed.</text><path class="connector" d="M352 304H480" fill="none" stroke="#4B6070" stroke-width="2"  marker-end="url(#arrow)"/><path class="connector" d="M768 304H896" fill="none" stroke="#4B6070" stroke-width="2"  marker-end="url(#arrow)"/><path class="connector" d="M624 400V472" fill="none" stroke="#4B6070" stroke-width="2"  marker-end="url(#arrow)"/><path class="connector" d="M768 540H896" fill="none" stroke="#4B6070" stroke-width="2"  marker-end="url(#arrow)"/><path class="connector" d="M1056 472V400" fill="none" stroke="#4B6070" stroke-width="2"  marker-end="url(#arrow)"/><rect class="label-mask" x="364" y="260" width="104" height="28" fill="#FFFFFF"/><text x="368" y="280" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4B6070">sample</text><rect class="label-mask" x="780" y="260" width="104" height="28" fill="#FFFFFF"/><text x="784" y="280" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4B6070">used by</text><g class="node"><rect x="64" y="224" width="288" height="176" rx="8" fill="#FFFFFF" stroke="#0A4054" stroke-width="2"/><text x="88" y="268" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0A4054">Texture + UVs</text><text x="88" y="308" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#0A4054">Locate and sample</text><text x="88" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#0A4054">stored data</text></g><g class="node"><rect x="480" y="224" width="288" height="176" rx="8" fill="#E4F2F1" stroke="#029990" stroke-width="2"/><text x="504" y="268" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0A4054">Material graph</text><text x="504" y="308" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#0A4054">Values and operations</text><text x="504" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#0A4054">Surface properties</text></g><g class="node"><rect x="896" y="224" width="320" height="176" rx="8" fill="#FFFFFF" stroke="#0A4054" stroke-width="2"/><text x="920" y="268" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0A4054">UE renderer</text><text x="920" y="308" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#0A4054">Geometry, lights, view</text><text x="920" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#0A4054">Programs → final image</text></g><g class="node"><rect x="480" y="472" width="288" height="136" rx="8" fill="#FFFFFF" stroke="#0A4054" stroke-width="2"/><text x="504" y="516" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0A4054">Optional instance</text><text x="504" y="556" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#0A4054">Override parameters</text></g><g class="node"><rect x="896" y="472" width="320" height="136" rx="8" fill="#FFFFFF" stroke="#0A4054" stroke-width="2"/><text x="920" y="516" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0A4054">Mesh assignment</text><text x="920" y="556" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#0A4054">Material or instance</text><text x="920" y="588" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#0A4054">for this mesh region</text></g><line x1="64" y1="644" x2="1216" y2="644" stroke="#C9D7DD"/><text x="64" y="680" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4B6070">A Material may be assigned directly. The instance inherits the parent graph; assignment selects it.</text></svg>