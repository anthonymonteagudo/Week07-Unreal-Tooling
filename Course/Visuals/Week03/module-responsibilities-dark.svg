<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="module-responsibilities-dark-title module-responsibilities-dark-desc"><title id="module-responsibilities-dark-title">Three files, three responsibilities</title><desc id="module-responsibilities-dark-desc">The operations return data. The UI chooses how to display it.</desc><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#9FD1D0"/></marker></defs><path d="M352 232H452" fill="none" stroke="#9FD1D0" stroke-width="6" marker-end="url(#arrow)"/><path d="M840 232H934" fill="none" stroke="#9FD1D0" stroke-width="6" marker-end="url(#arrow)"/><text x="68" y="102" fill="#9FD1D0" font-family="Arial,sans-serif" font-size="40" font-weight="700">Step 08</text><rect x="64" y="160" width="276" height="172" rx="8" fill="none" stroke="#FFFFFF" stroke-width="4"/><text x="90" y="222" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="40" font-weight="700">main.py</text><text x="90" y="288" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="28" font-weight="400">starts the window</text><rect x="466" y="160" width="362" height="172" rx="8" fill="none" stroke="#9FD1D0" stroke-width="4"/><text x="492" y="222" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="40" font-weight="700">UI module</text><text x="492" y="288" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="28" font-weight="400">handles the click</text><rect x="948" y="160" width="276" height="172" rx="8" fill="none" stroke="#FFFFFF" stroke-width="4"/><text x="974" y="222" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="36" font-weight="700">Operations</text><text x="974" y="288" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="28" font-weight="400">assesses assets</text><path d="M1084 350V402Q1084 410 1076 410H652Q644 410 644 402V352" fill="none" stroke="#9FD1D0" stroke-width="6" marker-end="url(#arrow)"/><text x="808" y="455" fill="#9FD1D0" font-family="Arial,sans-serif" font-size="32" font-weight="400">results</text><text x="64" y="490" fill="#C8DEE5" font-family="Arial,sans-serif" font-size="30" font-weight="400">File names share the step_08_ prefix.</text></svg>