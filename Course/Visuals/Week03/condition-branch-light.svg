<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" role="img" aria-labelledby="condition-branch-light-title condition-branch-light-desc"><title id="condition-branch-light-title">A condition selects one branch</title><desc id="condition-branch-light-desc">Exactly one report runs for this if/else decision.</desc><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#029990"/></marker></defs><path d="M180 140H140V304" fill="none" stroke="#029990" stroke-width="6" marker-end="url(#arrow)"/><path d="M460 140H520V304" fill="none" stroke="#029990" stroke-width="6" marker-end="url(#arrow)"/><path d="M320 44L460 140L320 236L180 140Z" fill="none" stroke="#029990" stroke-width="4"/><text x="224" y="128" fill="#0A4054" font-family="Arial,sans-serif" font-size="32" font-weight="700">difference</text><text x="222" y="176" fill="#0A4054" font-family="Arial,sans-serif" font-size="32" font-weight="700">&gt; tolerance?</text><text x="54" y="277" fill="#029990" font-family="Arial,sans-serif" font-size="36" font-weight="400">True</text><text x="528" y="277" fill="#029990" font-family="Arial,sans-serif" font-size="32" font-weight="400">False</text><rect x="20" y="324" width="260" height="112" rx="8" fill="none" stroke="#0A4054" stroke-width="4"/><text x="42" y="392" fill="#0A4054" font-family="Arial,sans-serif" font-size="36" font-weight="700">Report FIX</text><rect x="360" y="324" width="260" height="112" rx="8" fill="none" stroke="#0A4054" stroke-width="4"/><text x="380" y="392" fill="#0A4054" font-family="Arial,sans-serif" font-size="36" font-weight="700">Report PASS</text></svg>