<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="uv-scale-dark-title uv-scale-dark-desc"><title id="uv-scale-dark-title">UV scale changes sampled coverage</title><desc id="uv-scale-dark-desc">Illustrative UV square: 2× side length gives 4× UV area and 2× density.</desc><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#9FD1D0"/></marker></defs><text x="64" y="62" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="36" font-weight="700">Same mesh and texture resolution</text><rect x="92" y="114" width="300" height="300" rx="8" fill="none" stroke="#C8DEE5" stroke-width="4"/><rect x="204.5" y="226.5" width="75" height="75" rx="8" fill="none" stroke="#9FD1D0" stroke-width="4"/><text x="106" y="469" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="32" font-weight="400">UV side: 0.25</text><path d="M440 264H774" fill="none" stroke="#9FD1D0" stroke-width="6" marker-end="url(#arrow)"/><text x="514" y="212" fill="#9FD1D0" font-family="Arial,sans-serif" font-size="40" font-weight="700">scale = 2</text><text x="468" y="343" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="32" font-weight="400">Both U and V</text><rect x="852" y="114" width="300" height="300" rx="8" fill="none" stroke="#C8DEE5" stroke-width="4"/><rect x="927" y="189" width="150" height="150" rx="8" fill="none" stroke="#9FD1D0" stroke-width="4"/><text x="868" y="469" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="32" font-weight="400">UV side: 0.50</text></svg>