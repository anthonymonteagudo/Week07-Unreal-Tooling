<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="loop-route-dark-title loop-route-dark-desc"><title id="loop-route-dark-title">A loop processes every item</title><desc id="loop-route-dark-desc">The body runs for the final item too. Then the loop finishes.</desc><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#9FD1D0"/></marker></defs><path d="M220 244H360" fill="none" stroke="#9FD1D0" stroke-width="6" marker-end="url(#arrow)"/><path d="M640 244H764" fill="none" stroke="#9FD1D0" stroke-width="6" marker-end="url(#arrow)"/><path d="M500 342V426" fill="none" stroke="#9FD1D0" stroke-width="6" marker-end="url(#arrow)"/><path d="M1060 166V80Q1060 72 1052 72H508Q500 72 500 80V136" fill="none" stroke="#9FD1D0" stroke-width="6" marker-end="url(#arrow)"/><rect x="52" y="188" width="152" height="112" rx="8" fill="none" stroke="#FFFFFF" stroke-width="4"/><text x="76" y="254" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="36" font-weight="700">assets</text><path d="M500 144L640 244L500 344L360 244Z" fill="none" stroke="#9FD1D0" stroke-width="4"/><text x="428" y="232" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="30" font-weight="700">Next item</text><text x="425" y="274" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="30" font-weight="700">available?</text><text x="672" y="209" fill="#9FD1D0" font-family="Arial,sans-serif" font-size="30" font-weight="400">Yes</text><text x="536" y="391" fill="#9FD1D0" font-family="Arial,sans-serif" font-size="30" font-weight="400">No</text><rect x="780" y="164" width="440" height="160" rx="8" fill="none" stroke="#FFFFFF" stroke-width="4"/><text x="806" y="222" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="32" font-weight="700">asset_name = item</text><text x="806" y="281" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="32" font-weight="400">print(asset_name)</text><rect x="358" y="438" width="284" height="68" rx="8" fill="none" stroke="#FFFFFF" stroke-width="4"/><text x="382" y="484" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="32" font-weight="400">After the loop</text></svg>