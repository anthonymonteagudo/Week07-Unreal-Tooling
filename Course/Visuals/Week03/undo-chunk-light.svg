<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="undo-chunk-light-title undo-chunk-light-desc"><title id="undo-chunk-light-title">Several commands, one Undo</title><desc id="undo-chunk-light-desc">finally closes the chunk even when the operation raises an error.</desc><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#029990"/></marker></defs><path d="M328 216H442" fill="none" stroke="#029990" stroke-width="6" marker-end="url(#arrow)"/><path d="M828 216H942" fill="none" stroke="#029990" stroke-width="6" marker-end="url(#arrow)"/><text x="60" y="98" fill="#029990" font-family="Arial,sans-serif" font-size="38" font-weight="700">Open chunk</text><text x="60" y="219" fill="#0A4054" font-family="Arial,sans-serif" font-size="30" font-weight="400">openChunk=True</text><rect x="456" y="68" width="358" height="288" rx="8" fill="none" stroke="#029990" stroke-width="4"/><text x="488" y="124" fill="#0A4054" font-family="Arial,sans-serif" font-size="38" font-weight="400">Height</text><text x="488" y="208" fill="#0A4054" font-family="Arial,sans-serif" font-size="38" font-weight="400">Rotation</text><text x="488" y="292" fill="#0A4054" font-family="Arial,sans-serif" font-size="38" font-weight="400">Scale</text><text x="954" y="98" fill="#029990" font-family="Arial,sans-serif" font-size="38" font-weight="700">Close chunk</text><text x="954" y="219" fill="#0A4054" font-family="Arial,sans-serif" font-size="30" font-weight="400">closeChunk=True</text><path d="M1068 306V412Q1068 420 1060 420H230" fill="none" stroke="#029990" stroke-width="6" marker-end="url(#arrow)"/><text x="490" y="480" fill="#0A4054" font-family="Arial,sans-serif" font-size="38" font-weight="700">One viewport Undo</text></svg>