<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="list-positions-dark-title list-positions-dark-desc"><title id="list-positions-dark-title">A list keeps an order</title><desc id="list-positions-dark-desc">Python starts list indexing at 0.</desc><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#9FD1D0"/></marker></defs><text x="80" y="70" fill="#9FD1D0" font-family="Arial,sans-serif" font-size="42" font-weight="700">assets</text><text x="460" y="70" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="30" font-weight="400">Each position selects one item</text><rect x="80" y="145" width="360" height="176" rx="8" fill="none" stroke="#FFFFFF" stroke-width="4"/><text x="104" y="193" fill="#C8DEE5" font-family="Arial,sans-serif" font-size="30" font-weight="400">index 0</text><text x="104" y="258" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="36" font-weight="700">"BoxSmall"</text><rect x="484" y="145" width="360" height="176" rx="8" fill="none" stroke="#FFFFFF" stroke-width="4"/><text x="508" y="193" fill="#C8DEE5" font-family="Arial,sans-serif" font-size="30" font-weight="400">index 1</text><text x="508" y="258" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="36" font-weight="700">"BoxLarge"</text><rect x="888" y="145" width="360" height="176" rx="8" fill="none" stroke="#FFFFFF" stroke-width="4"/><text x="912" y="193" fill="#C8DEE5" font-family="Arial,sans-serif" font-size="30" font-weight="400">index 2</text><text x="912" y="258" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="36" font-weight="700">"Teapot"</text><path d="M260 330V402" fill="none" stroke="#9FD1D0" stroke-width="6" marker-end="url(#arrow)"/><text x="80" y="465" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="40" font-weight="400">assets[0]  returns  "BoxSmall"</text></svg>