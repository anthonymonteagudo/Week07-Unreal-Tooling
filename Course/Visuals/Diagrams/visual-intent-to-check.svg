ght="400" fill="#0A4054">Recognizable silhouette</text><text x="88" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#0A4054">at the intended view</text></g><g class="node"><rect x="480" y="224" width="320" height="200" rx="8" fill="#E4F2F1" stroke="#029990" stroke-width="2"/><text x="504" y="268" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0A4054">Asset relationship</text><text x="504" y="308" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#0A4054">Shape and selected LOD</text><text x="504" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#0A4054">support that outline</text></g><g class="node"><rect x="896" y="224" width="320" height="200" rx="8" fill="#FFFFFF" stroke="#0A4054" stroke-width="2"/><text x="920" y="268" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0A4054">Evidence</text><text x="920" y="308" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#0A4054">Compare views and</text><text x="920" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#0A4054">inspect active LOD</text></g><text x="64" y="512" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#029990">DISCUSS</text><text x="64" y="552" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#0A4054">What would you preserve, and how could you tell?</text><line x1="64" y1="644" x2="1216" y2="644" stroke="#C9D7DD"/><text x="64" y="680" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4B6070">Explore further: Art, form, and readability · current study slides 21–25.</text></svg>